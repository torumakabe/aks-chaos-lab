apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - aks-node-class.yaml
  - node-pool.yaml
configMapGenerator:
  - name: localdns-config
    namespace: kube-system
    envs:
      - .env
    options:
      disableNameSuffixHash: true
      annotations:
        config.kubernetes.io/local-config: "true"
replacements:
  - source:
      kind: ConfigMap
      name: localdns-config
      fieldPath: data.AZURE_AKS_LOCAL_DNS_MODE
    targets:
      - select:
          group: karpenter.azure.com
          version: v1beta1
          kind: AKSNodeClass
          name: chaos-arm64
        fieldPaths:
          - spec.localDNS.mode
