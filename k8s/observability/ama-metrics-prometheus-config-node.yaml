apiVersion: v1
kind: ConfigMap
metadata:
  name: ama-metrics-prometheus-config-node
  namespace: kube-system
data:
  prometheus-config: |-
    scrape_configs:
      - job_name: localdns-metrics
        scrape_interval: 30s
        scheme: http
        metrics_path: /metrics
        relabel_configs:
          - source_labels: [__address__]
            replacement: '$NODE_NAME'
            target_label: instance
        static_configs:
          - targets: ['$NODE_IP:9253']
