name: Refresh public uv lock

on:
  workflow_dispatch:
  pull_request:
    paths:
      - .github/workflows/refresh-uv-lock.yml
      - pyproject.toml
      - uv.lock

permissions:
  contents: read

jobs:
  refresh-lock:
    name: Generate public uv.lock
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Setup uv
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          resolution-strategy: "lowest"
          python-version: "3.14"
      - name: Refresh lock
        run: uv lock
      - name: Check lock consistency
        run: uv lock --check
      - name: Check lock package sources
        run: uv run --no-project "${{ github.workspace }}/scripts/tasks.py" check-public-lock
      - name: Upload public lock
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: uv-lock-public
          path: uv.lock
          if-no-files-found: error
          retention-days: 7
