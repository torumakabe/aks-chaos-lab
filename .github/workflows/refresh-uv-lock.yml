name: Refresh public uv lock

on:
  workflow_dispatch:
  pull_request:
    paths:
      - .github/workflows/refresh-uv-lock.yml
      - pyproject.toml
      - src/**/pyproject.toml
      - uv.lock

permissions:
  contents: read

jobs:
  refresh-lock:
    name: Generate public uv.lock
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # adopt-public-lock matches runs by head SHA, so resolve that commit
          # rather than the pull request merge commit.
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Setup uv
        uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4 # v10.1.0
        with:
          resolution-strategy: "lowest"
          python-version: "3.14"
      - name: Refresh lock
        run: |
          cutoff="$(uv run --no-project "${{ github.workspace }}/scripts/tasks.py" lock-cutoff)"
          echo "UV_EXCLUDE_NEWER=${cutoff}" >> "${GITHUB_ENV}"
          uv lock --exclude-newer "${cutoff}"
      - name: Check lock consistency
        run: uv lock --check --exclude-newer "${UV_EXCLUDE_NEWER}"
      - name: Check lock package sources
        run: uv run --no-project "${{ github.workspace }}/scripts/tasks.py" check-public-lock
      - name: Upload public lock
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: uv-lock-public
          path: uv.lock
          if-no-files-found: error
          retention-days: 7
