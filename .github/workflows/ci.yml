name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  lock:
    name: uv Lock Check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Setup uv
        uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b # v8.1.0
        with:
          version: "0.12.2"
          python-version: "3.14"
      - name: Check lock consistency
        run: uv lock --check
      - name: Check lock package sources
        run: uv run --no-project "${{ github.workspace }}/scripts/tasks.py" check-public-lock

  format:
    name: Ruff Format Check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Setup uv
        uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b # v8.1.0
        with:
          version: "0.12.2"
          python-version: "3.14"
      - name: Sync deps (dev)
        run: uv run --no-project "${{ github.workspace }}/scripts/tasks.py" sync-dev
      - name: Ruff format check
        run: uv run --no-project "${{ github.workspace }}/scripts/tasks.py" format-check
  lint:
    name: Ruff Lint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Setup uv
        uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b # v8.1.0
        with:
          version: "0.12.2"
          python-version: "3.14"
      - name: Sync deps (dev)
        run: uv run --no-project "${{ github.workspace }}/scripts/tasks.py" sync-dev
      - name: Ruff check
        run: uv run --no-project "${{ github.workspace }}/scripts/tasks.py" lint-check

  typecheck:
    name: ty Typecheck
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Setup uv
        uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b # v8.1.0
        with:
          version: "0.12.2"
          python-version: "3.14"
      - name: Sync deps (dev)
        run: uv run --no-project "${{ github.workspace }}/scripts/tasks.py" sync-dev
      - name: ty check
        run: uv run --no-project "${{ github.workspace }}/scripts/tasks.py" typecheck
  tests:
    name: Pytest
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Setup uv
        uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b # v8.1.0
        with:
          version: "0.12.2"
          python-version: "3.14"
      - name: Sync deps (dev)
        run: uv run --no-project "${{ github.workspace }}/scripts/tasks.py" sync-dev
      - name: Run unit tests with coverage
        run: uv run --no-project "${{ github.workspace }}/scripts/tasks.py" test
      - name: Install Lefthook
        run: |
          set -euxo pipefail
          LEFTHOOK_VERSION=2.1.10
          LEFTHOOK_SHA256=0b14162a0bb2f0c64ae0759f6102f6e19c4d00981666a8ac73d4f5a6878ada4f
          mkdir -p "$HOME/.local/bin"
          curl -fsSL -o /tmp/lefthook.gz "https://github.com/evilmartians/lefthook/releases/download/v${LEFTHOOK_VERSION}/lefthook_${LEFTHOOK_VERSION}_Linux_x86_64.gz"
          echo "${LEFTHOOK_SHA256}  /tmp/lefthook.gz" | sha256sum -c -
          gzip -dc /tmp/lefthook.gz > "$HOME/.local/bin/lefthook"
          chmod +x "$HOME/.local/bin/lefthook"
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
      - name: Test Git hooks
        run: uv run --no-project "${{ github.workspace }}/scripts/tasks.py" test-hooks
  bicep:
    name: Bicep Build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Install Bicep CLI
        run: |
          set -euxo pipefail
          BICEP_VERSION=v0.46.1
          mkdir -p "$HOME/.local/bin"
          curl -L -o "$HOME/.local/bin/bicep" "https://github.com/Azure/bicep/releases/download/${BICEP_VERSION}/bicep-linux-x64"
          chmod +x "$HOME/.local/bin/bicep"
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
      - name: Bicep version
        run: bicep --version
      - name: Restore Bicep modules
        run: bicep restore infra/main.bicep
      - name: Validate Bicep Templates
        run: bicep build infra/main.bicep
  k8s-validate:
    name: K8s Manifest Validation
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Install kubeconform
        run: |
          set -euxo pipefail
          KUBECONFORM_VERSION=v0.7.0
          curl -sL "https://github.com/yannh/kubeconform/releases/download/${KUBECONFORM_VERSION}/kubeconform-linux-amd64.tar.gz" | \
            tar xz -C /usr/local/bin
      - name: Validate K8s manifests
        run: |
          kubeconform -strict -summary \
            -kubernetes-version 1.34.0 \
            -skip VerticalPodAutoscaler,CiliumNetworkPolicy,Kustomization,Gateway,HTTPRoute,Instrumentation \
            k8s/apps/chaos-app/*.yaml
  workflows-lint:
    name: Workflows Lint (actionlint)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Run actionlint
        run: docker run --rm -v "$PWD:/repo" -w /repo rhysd/actionlint:1.7.12 -color
