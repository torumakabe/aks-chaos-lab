# Platform Integration Test Workflow
# Manual trigger for full-stack integration testing with temporary Azure environment

name: Platform Integration Test

on:
  workflow_dispatch:
    inputs:
      branch:
        description: 'Branch to test (leave empty to use triggering branch)'
        required: false
        default: ''
        type: string
      test_scope:
        description: 'Test scope'
        required: false
        default: 'full'
        type: choice
        options:
          - full
          - infra-only

concurrency:
  group: integration-test
  cancel-in-progress: false

permissions:
  id-token: write
  contents: read

env:
  AZURE_ENV_NAME: inttest-${{ github.run_id }}
  AZURE_LOCATION: japaneast

jobs:
  validate:
    name: Validate Bicep Templates
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: integration-test
    outputs:
      env_name: ${{ env.AZURE_ENV_NAME }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.branch || github.ref_name }}

      - name: Azure Login
        uses: azure/login@7ddb5af1ef8758cf1353cf3b42f940aee27ba21c # v3.0.2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Validate Bicep Templates
        run: |
          echo "::group::Bicep Build"
          az bicep build --file infra/main.bicep
          az bicep build --file infra/sli/main.bicep
          echo "::endgroup::"

          echo "::group::ARM Deployment Validation"
          az deployment sub validate \
            --location "${{ env.AZURE_LOCATION }}" \
            --template-file infra/main.bicep \
            --parameters location="${{ env.AZURE_LOCATION }}"
          echo "::endgroup::"

          {
            echo "## ✅ Bicep Validation Passed"
            echo "- Branch: \`${{ inputs.branch || github.ref_name }}\`"
            echo "- Run ID: \`${{ github.run_id }}\`"
          } >> "$GITHUB_STEP_SUMMARY"

  provision-and-deploy:
    name: Provision and Deploy
    runs-on: ubuntu-latest
    timeout-minutes: 35
    needs: validate
    environment: integration-test
    env:
      AZURE_SUBSCRIPTION_ID: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
      AZD_ALLOW_PUBLIC_SOURCES: ${{ vars.AZD_ALLOW_PUBLIC_SOURCES }}
    outputs:
      resource_group: ${{ steps.provision.outputs.resource_group }}
      ingress_fqdn: ${{ steps.provision.outputs.ingress_fqdn }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.branch || github.ref_name }}

      - name: Azure Login
        uses: azure/login@7ddb5af1ef8758cf1353cf3b42f940aee27ba21c # v3.0.2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Install Azure Developer CLI
        uses: Azure/setup-azd@0b7e3a35ab00f2eee7080c845eb39c3f0ebfa553 # v2.4.0

      - name: Setup uv and Python
        uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4 # v10.1.0
        with:
          resolution-strategy: "lowest"
          python-version: "3.14"

      - name: Install kubelogin
        uses: Azure/use-kubelogin@0ce7c36141aa27d4934872cf00b0120804c98a29 # v1.3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Login to azd
        run: azd auth login --client-id ${{ secrets.AZURE_CLIENT_ID }} --federated-credential-provider github --tenant-id ${{ secrets.AZURE_TENANT_ID }}

      - name: Configure azd alpha features
        run: |
          azd config set alpha.aks.helm on
          azd config set alpha.aks.kustomize on

      - name: Initialize azd environment
        run: |
          echo "::group::azd env new"
          azd env new ${{ env.AZURE_ENV_NAME }} --no-prompt
          azd env set AZURE_LOCATION ${{ env.AZURE_LOCATION }}
          azd env set AZURE_SUBSCRIPTION_ID "$AZURE_SUBSCRIPTION_ID"
          echo "::endgroup::"

      - name: Provision and deploy
        id: provision
        env:
          TEST_SCOPE: ${{ inputs.test_scope || 'full' }}
        run: |
          if [ "$TEST_SCOPE" = "infra-only" ]; then
            azd provision base --no-prompt
          else
            azd up --no-prompt
          fi

          RESOURCE_GROUP=$(azd env get-value AZURE_RESOURCE_GROUP)
          INGRESS_FQDN=$(azd env get-value AZURE_INGRESS_FQDN)
          {
            echo "resource_group=$RESOURCE_GROUP"
            echo "ingress_fqdn=$INGRESS_FQDN"
          } >> "$GITHUB_OUTPUT"

          {
            echo "## ✅ ${TEST_SCOPE} Completed"
            echo "- Resource Group: \`$RESOURCE_GROUP\`"
            echo "- Ingress FQDN: \`$INGRESS_FQDN\`"
          } >> "$GITHUB_STEP_SUMMARY"

  test:
    name: Run Integration Tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: provision-and-deploy
    if: (inputs.test_scope || 'full') == 'full'
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.branch || github.ref_name }}

      - name: Setup Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.14'

      - name: Install uv
        uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4 # v10.1.0
        with:
          resolution-strategy: "lowest"

      - name: Smoke test - Health endpoint
        env:
          INGRESS_FQDN: ${{ needs.provision-and-deploy.outputs.ingress_fqdn }}
        run: |
          echo "::group::Smoke Test - /health"

          # Retry loop - wait for ingress and app to be ready
          MAX_RETRIES=12
          RETRY_INTERVAL=30
          RETRY_COUNT=0
          HTTP_STATUS="000"

          echo "Waiting for application to be ready at http://${INGRESS_FQDN}/health"

          while [ "$RETRY_COUNT" -lt "$MAX_RETRIES" ]; do
            if ! HTTP_STATUS=$(curl -sS -o /dev/null -w "%{http_code}" "http://${INGRESS_FQDN}/health" --max-time 30); then
              HTTP_STATUS="000"
            fi
            echo "Attempt $((RETRY_COUNT + 1))/$MAX_RETRIES: HTTP $HTTP_STATUS"

            if [ "$HTTP_STATUS" = "200" ]; then
              echo "Health check passed (HTTP $HTTP_STATUS)"
              {
                echo "## ✅ Smoke Test Passed"
                echo "- Endpoint: \`http://${INGRESS_FQDN}/health\`"
                echo "- Status: HTTP $HTTP_STATUS"
                echo "- Attempts: $((RETRY_COUNT + 1))"
              } >> "$GITHUB_STEP_SUMMARY"
              echo "::endgroup::"
              exit 0
            fi

            RETRY_COUNT=$((RETRY_COUNT + 1))
            if [ "$RETRY_COUNT" -lt "$MAX_RETRIES" ]; then
              echo "Waiting ${RETRY_INTERVAL}s before next attempt..."
              sleep "$RETRY_INTERVAL"
            fi
          done

          echo "Health check failed after $MAX_RETRIES attempts (last HTTP $HTTP_STATUS)"
          {
            echo "## ❌ Smoke Test Failed"
            echo "- Endpoint: \`http://${INGRESS_FQDN}/health\`"
            echo "- Status: HTTP $HTTP_STATUS"
            echo "- Attempts: $MAX_RETRIES"
          } >> "$GITHUB_STEP_SUMMARY"
          echo "::endgroup::"
          exit 1

      - name: Run platform integration tests
        env:
          INTEGRATION_TEST_URL: http://${{ needs.provision-and-deploy.outputs.ingress_fqdn }}
        run: |
          echo "::group::Platform Integration Tests"
          uv run --no-project "${GITHUB_WORKSPACE}/scripts/tasks.py" sync-dev
          uv run --no-project "${GITHUB_WORKSPACE}/scripts/tasks.py" test-integration
          echo "::endgroup::"

          echo "## ✅ Integration Tests Passed" >> "$GITHUB_STEP_SUMMARY"

  cleanup:
    name: Cleanup Resources
    runs-on: ubuntu-latest
    timeout-minutes: 90
    needs: [validate, provision-and-deploy, test]
    if: always() && needs.provision-and-deploy.result != 'skipped'
    environment: integration-test
    env:
      AZURE_SUBSCRIPTION_ID: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.branch || github.ref_name }}

      - name: Azure Login
        uses: azure/login@7ddb5af1ef8758cf1353cf3b42f940aee27ba21c # v3.0.2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Setup uv and Python
        uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4 # v10.1.0
        with:
          resolution-strategy: "lowest"
          python-version: "3.14"

      - name: Delete integration resources
        run: |
          uv run --no-project --no-config --offline --no-python-downloads scripts/cleanup-azure-monitor-sli-resources.py
          {
            echo "## 🧹 Cleanup Completed"
            echo "- Environment: \`$AZURE_ENV_NAME\`"
          } >> "$GITHUB_STEP_SUMMARY"
