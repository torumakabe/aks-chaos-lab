version: 2
updates:
  # gh-aw only manages the exact github/gh-aw-actions ignore entry below.
  - package-ecosystem: "github-actions"
    directory: "/"
    exclude-paths:
      - ".github/workflows/*.lock.yml"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
    groups:
      github-actions-compatible:
        patterns:
          - "*"
        update-types:
          - "minor"
          - "patch"
    ignore:
      - dependency-name: "github/gh-aw-actions/*"
      - dependency-name: "github/gh-aw-actions" # Managed by gh aw compile. Version-locked to the gh-aw compiler; do not bump.

  - package-ecosystem: "docker"
    directory: "/src/api"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 3
    groups:
      docker-compatible:
        patterns:
          - "*"
        update-types:
          - "minor"
          - "patch"
    ignore:
      # check-uv-version keeps this image equal to the workspace uv lower bound.
      - dependency-name: "ghcr.io/astral-sh/uv"

# uv updates remain on the refresh-uv-lock workflow; see docs/deployment.md.
