version: 2
updates:
  # gh-aw owns generated *.lock.yml workflows and .github/aw/actions-lock.json.
  # Update their action pins only through `gh aw compile`, not Dependabot.
  - package-ecosystem: "github-actions"
    directory: "/"
    exclude-paths:
      - ".github/workflows/*.lock.yml"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
    groups:
      github-actions-compatible:
        patterns:
          - "*"
        update-types:
          - "minor"
          - "patch"
    ignore:
      # Managed by gh aw compile and version-locked to the compiler.
      - dependency-name: "github/gh-aw-actions"

  - package-ecosystem: "docker"
    directory: "/src/api"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 3
    groups:
      docker-compatible:
        patterns:
          - "*"
        update-types:
          - "minor"
          - "patch"
    ignore:
      # check-uv-version keeps this image equal to the workspace uv lower bound.
      - dependency-name: "astral-sh/uv"

# uv updates remain on the refresh-uv-lock workflow; see docs/deployment.md.
