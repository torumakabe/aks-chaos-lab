schema_version = 2
kubernetes_schema_excluded_kinds = [
  "AKSNodeClass",
  "CiliumNetworkPolicy",
  "Component",
  "ContainerNetworkLog",
  "Gateway",
  "HTTPRoute",
  "Instrumentation",
  "Kustomization",
  "NodePool",
  "VerticalPodAutoscaler",
]

[[rules]]
id = "kubernetes-version"
enforce = false

[rules.canonical]
path = "infra/main.bicep"
selector = "bicep-parameter:kubernetesVersion"

[[rules.targets]]
path = "scripts/tasks.py"
selector = "python-constant:K8S_VERSION"

[rules.exception]
reason = "The IaC and shared Kubernetes validation task predate this checker and differ."
owner = "platform"
tracking = "plan:separate-baseline-fixes"
review_by = 2026-11-30
resolution = "Select one supported Kubernetes version and update the IaC and shared validation coordinate together."
canonical_values = ["1.35"]
target_fingerprint = [
  { path = "scripts/tasks.py", selector = "python-constant:K8S_VERSION", value = "1.33.0" },
]

[[rules]]
id = "gh-aw-compiler-version"
enforce = false

[rules.canonical]
path = ".github/workflows/copilot-setup-steps.yml"
selector = "gh-aw-setup-version"

[[rules.targets]]
path = ".github/workflows/aks-updates-analyzer.lock.yml"
selector = "gh-aw-compiler-version"

[rules.exception]
reason = "The Copilot setup workflow and generated agentic workflow were produced with different gh-aw releases."
owner = "developer-experience"
tracking = "plan:separate-baseline-fixes"
review_by = 2026-11-30
resolution = "Upgrade the setup workflow and regenerate all gh-aw locks with the same compiler release."
canonical_values = ["v0.71.1"]
target_fingerprint = [
  { path = ".github/workflows/aks-updates-analyzer.lock.yml", selector = "gh-aw-compiler-version", value = "v0.79.6" },
]

[[rules]]
id = "docker-base-digest"
enforce = false

[rules.canonical]
path = "src/api/Dockerfile"
selector = "docker-from"

[[rules.targets]]
path = "src/api/Dockerfile"
selector = "docker-from"

[rules.exception]
reason = "The existing API image uses tagged base images without immutable digests."
owner = "application-platform"
tracking = "plan:separate-baseline-fixes"
review_by = 2026-11-30
resolution = "Pin every Dockerfile base image to a reviewed sha256 digest and enable enforcement."
canonical_values = ["ghcr.io/astral-sh/uv:0.12.2", "python:3.14-slim"]
target_fingerprint = [
  { path = "src/api/Dockerfile", selector = "docker-from", value = "python:3.14-slim" },
  { path = "src/api/Dockerfile", selector = "docker-from", value = "ghcr.io/astral-sh/uv:0.12.2" },
]
